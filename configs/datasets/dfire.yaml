# D-Fire — primary few-shot detection benchmark (fire / smoke)
# License: research use — Confirmed 2026-08-04 (see docs/licenses.md)
name: dfire
task: detection
images: 21527
classes:
  - fire
  - smoke
annotation_format: yolo_boxes        # official labels are YOLO (normalized);
                                     # download_datasets.py converts to COCO
                                     # JSON in data/annotations/ (gitignored)
mask_to_box: false
splits:
  train: data/raw/dfire/train
  val: data/raw/dfire/val
  test: data/raw/dfire/test
meta:
  zero_shot_map50_gdino: 27.5      # Michailidou et al. (preprint), Table III
  transfer_map50_gdino: 65.6       # full-label partial fine-tuning upper bound
  gap_pp: 38.1
