# Mode C — EXPLORATORY source-domain transfer (never a failure of the primary method)
# Gating coefficients (or small gating MLP) pre-trained on a SOURCE domain
# (COCO / LVIS episodic simulation) and FROZEN during target evaluation.
mode: C
description: source-domain meta-training of gating coefficients/MLP, frozen at target evaluation
exploratory: true
source_domains: [coco, lvis]
learned_artifacts:
  coefficients: true      # alpha, beta, gamma learned on source domain
  gate_mlp: false         # optional MLP alternative
  temperature: true       # learned on source-domain calibration set
target_eval: frozen       # no target-domain training or tuning of any kind
reporting:
  separate: true          # reported separately; not a failure condition if it does not transfer
  primary_transfer_test: mode_A   # Mode A is the primary RQ3 transfer test
