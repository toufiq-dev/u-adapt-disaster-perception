# Mode B — SECONDARY variant: gating MLP (5 -> 128 -> 1, ~900 params)
# Reported for comparison; logistic-regression gate is the primary Mode B claim.
mode: B
description: lightweight calibration with small gating MLP on frozen cached features
gate: mlp
primary_claim: false
initialization:
  random: true            # default init; COCO/LVIS-pretrained init is the former Mode C ablation (mode_B_coco_lvis_init.yaml)
mlp:
  hidden_dim: 128
  dropout_p: 0.3
  l2_weight_decay: 1.0e-4
  early_stopping_patience: 10
  cv_folds: 5
calibration:
  boxes_per_class: 20
  disjoint_from_support: true
  support_shots: [1, 3, 5]
uncertainty:
  mc_dropout_passes: 10
top_k: 100
temperature: learned
