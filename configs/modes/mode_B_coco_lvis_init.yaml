# Mode B — COCO/LVIS-pretrained gate initialization (ablation; the former Mode C)
# Per proposal §5.4.3, source-domain meta-training is NOT a separate evaluation
# mode. It is folded into Mode B as a gate-INITIALIZATION ablation: the Mode B
# gate is initialized either randomly (default, see mode_B_logreg.yaml /
# mode_B_mlp.yaml) or from weights pre-trained on COCO/LVIS episodic few-shot
# data, then calibrated on the same 20-box-per-class target set.
# Reported separately; if the pretrained init does not transfer, this is neither
# a failure of the primary method nor a weakness in the proposal.
mode: B
description: Mode B gate initialized from COCO/LVIS-pretrained weights, then calibrated on target (former Mode C)
gate: logistic_regression     # primary Mode B gate (MLP alternative supported)
primary_claim: false          # secondary ablation, reported separately
initialization:
  source: coco_lvis           # episodic few-shot pre-training on source domain
  random_default: false       # this config IS the pretrained-init variant
calibration:
  boxes_per_class: 20
  disjoint_from_support: true
  support_shots: [1, 3, 5]
  cv_folds: 5
  early_stopping_patience: 10
  l2_weight_decay: 1.0e-4
uncertainty:
  mc_dropout_passes: 10       # T = 10 stochastic forward passes
  mc_dropout_p: 0.3
  stability_check_T: 50       # one subset only
top_k: 100
temperature: learned          # calibrated on the TARGET 20-box set (source T not carried over)
reporting:
  separate: true              # not a failure condition if it does not transfer
  primary_transfer_test: mode_A   # Mode A is the primary RQ3 transfer test
